name: 📡 主页引擎

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "hero/make_hero.py"
      - "engine/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 开场大图由代码生成，所以也交给 CI 重画一遍 —— 图和生成器永远不会走散
      - name: 重画开场大图
        run: python hero/make_hero.py

      - name: 校验 SVG 是合法 XML（免得一整个主页白屏）
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          for f in ("hero/hero-light.svg", "hero/hero-dark.svg"):
              t = ET.parse(f)
              n = len(list(t.getroot().iter()))
              print(f"{f}: {pathlib.Path(f).stat().st_size // 1024} KB, {n} 个节点")
          PY

      - name: 生成数据卡 + 填模板
        run: python engine/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "🔄 主页引擎: 数据 / 大图更新 [skip ci]" && git push)
